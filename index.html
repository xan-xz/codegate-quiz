<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeGate · Programming assessment</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#e9eef6;background:#0b1019;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#15334466,transparent 55%)}header{height:88px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.logo{font-size:23px;font-weight:800;letter-spacing:-1px}.logo span{color:#9bee8d}header small{color:#93a1b4;font-size:12px;letter-spacing:2px}main{max-width:1040px;margin:70px auto;padding:0 24px}.eyebrow{font:12px monospace;letter-spacing:2px;color:#9bee8d}h1{font-size:clamp(35px,6vw,64px);line-height:1.07;letter-spacing:-2px;margin:23px 0}h2{font-size:27px;line-height:1.3;letter-spacing:-.7px}p{color:#9daabd;line-height:1.75}section{background:#121b29;border:1px solid #ffffff14;border-radius:20px;padding:32px}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:70px;align-items:center}.chips{display:flex;gap:12px;margin:30px 0}.chip{border:1px solid #ffffff1c;padding:10px 14px;border-radius:8px;color:#c0ccdb;font-size:13px}label{display:block;color:#bdc8d8;font-size:13px;margin:22px 0 10px}input{width:100%;padding:16px;background:#0b121e;border:1px solid #344153;border-radius:10px;color:white;font:16px monospace}button{cursor:pointer;border:0;border-radius:10px;padding:16px 21px;background:#a3ed94;color:#102617;font-weight:750;font-size:15px}button:disabled{opacity:.45;cursor:default}.wide{width:100%;margin-top:18px}.muted{color:#8695a9;font-size:13px}.error{color:#ff9999;min-height:20px}a{color:#9bee8d;text-decoration:none}footer{padding:32px 6vw;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;color:#68798e;font-size:12px}.line{height:5px;background:#263348;border-radius:8px;margin:24px 0}.line i{display:block;height:100%;background:#9bee8d;border-radius:8px}.option{display:flex;align-items:center;width:100%;text-align:left;background:#0d1522;border:1px solid #2a384b;color:#ced8e5;margin:12px 0;gap:18px}.option.selected{border-color:#9bee8d;background:#9bee8d15}.option b{font:13px monospace;color:#8393a9}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.secondary{background:#243247;color:#d7e1ee}#quiz{max-width:740px;margin:auto}.status{color:#9bee8d;font:12px monospace}.ban{position:fixed;inset:0;background:#c51127;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:100}.ban h1{font-size:clamp(64px,16vw,160px);letter-spacing:-7px;margin:12px 0}.ban p,.ban small{color:#ffe1e6}.ban .badge{font:15px monospace;letter-spacing:5px}.result{font-size:80px;color:#9bee8d;margin:24px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid #ffffff14}td button{padding:9px;font-size:12px}code{overflow-wrap:anywhere;color:#9bee8d;font-size:20px}.notice{border-left:2px solid #9bee8d;padding-left:16px}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr;gap:25px}main{margin:38px auto}section{padding:24px}header{padding:0 24px;height:72px}header small{font-size:9px}.chips{flex-wrap:wrap}footer{gap:20px}.tablewrap{overflow-x:auto}}
</style><header><div class="logo"><span>&lt;/&gt;</span> CodeGate</div><small>PROGRAMMING ASSESSMENT</small></header><main id="app"></main><footer><span>5 вопросов · Основы программирования</span><a href="/admin">Администратор ↗</a></footer><script>
const $=s=>document.querySelector(s), app=$('#app');let state=null,index=0,active=false,busy=false,adminKey='',offline=false;
let browser=localStorage.getItem('cg-browser');if(!browser){browser=crypto.randomUUID();localStorage.setItem('cg-browser',browser)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data={},admin=false){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(admin?{'X-Admin-Key':adminKey}:{})},body:JSON.stringify({...data,browser})});const v=await r.json();if(v.banned){banned(v.error);throw Error(v.error)}if(!r.ok)throw Error(v.error);return v}
function error(e){const el=$('#error');if(el)el.textContent=e.message||e}
function banned(reason){active=false;localStorage.setItem('cg-ban-pending',reason);app.innerHTML='<div class="ban"><div><div class="badge">ACCESS REVOKED</div><h1>BANNED</h1><p>'+esc(reason)+'</p><small>Попытка заблокирована. Обратитесь к администратору за новым кодом.</small></div></div>'}
async function ban(reason){if(!active)return;active=false;localStorage.setItem('cg-ban-pending',reason);banned(reason);try{await api('ban',{reason});localStorage.removeItem('cg-ban-pending')}catch{}}
function login(){app.innerHTML='<div class="grid"><div><div class="eyebrow">ЗАКРЫТЫЙ ДОСТУП / 01</div><h1>Покажи, что<br>знаешь код.</h1><p>Небольшой тест на основы программирования.<br>Твой доступ — персональный одноразовый код.</p><div class="chips"><span class="chip">5 вопросов</span><span class="chip">1 попытка</span><span class="chip">Честная игра</span></div></div><section><div class="eyebrow">ВХОД УЧАСТНИКА</div><h2>Твой код доступа</h2><p class="muted">Получи код у администратора. После активации он закрепится за этим браузером.</p><form id="login"><label for="code">Одноразовый код</label><input id="code" placeholder="Вставь код приглашения" required autocomplete="off" maxlength="80"><button class="wide">Продолжить →</button></form><p class="error" id="error" role="alert"></p><div class="muted">Уже активировал код? Открой сайт в том же браузере.</div></section></div>';$('#login').onsubmit=async e=>{e.preventDefault();try{await api('redeem',{code:$('#code').value});localStorage.removeItem('cg-ban-pending');await refresh()}catch(e){error(e)}}}
function ready(){active=false;app.innerHTML='<section id="quiz"><div class="eyebrow">ПЕРЕД СТАРТОМ</div><h1>Одна попытка.<br>Полная концентрация.</h1><p>После начала теста уход из окна, переключение вкладки или сворачивание приведут к блокировке попытки с экраном BANNED. Во время теста не открывай другие приложения и окна.</p><p class="notice">Повторное использование кода на другом устройстве запрещено. Некоторые клавиши снимка экрана блокируются, но браузер не может обнаружить все скриншоты, особенно на телефоне.</p><p class="muted">Даже случайная потеря фокуса может вызвать бан. Закрой уведомления и подготовься до старта. Контроль действует только во время теста.</p><label><input type="checkbox" id="agree" style="width:auto;margin-right:10px">Я понимаю правила и готов начать</label><button class="wide" id="start" disabled>Начать тест →</button><p id="error" class="error"></p></section>';$('#agree').onchange=e=>$('#start').disabled=!e.target.checked;$('#start').onclick=async()=>{try{await api('start');await refresh()}catch(e){error(e)}}}
function renderQuiz(){const q=state.questions[index];app.innerHTML='<div id="quiz"><div class="row"><span class="eyebrow">ОСНОВЫ ПРОГРАММИРОВАНИЯ</span><span class="status">● КОНТРОЛЬ АКТИВЕН</span></div><div class="line"><i style="width:'+((index+1)*20)+'%"></i></div><section><div class="muted">ВОПРОС '+(index+1)+' / 5</div><h2>'+esc(q.q)+'</h2>'+q.o.map((o,i)=>'<button class="option '+(state.answers[index]===i?'selected':'')+'" data-answer="'+i+'"><b>'+String.fromCharCode(65+i)+'</b>'+esc(o)+'</button>').join('')+'<p class="error" id="error" role="alert"></p><div class="row"><button id="prev" class="secondary" '+(index===0?'disabled':'')+'>← Назад</button><button id="next" '+(state.answers[index]===undefined?'disabled':'')+'>'+(index===4?'Завершить тест':'Следующий →')+'</button></div></section><p class="muted">Оставайся в этом окне до завершения теста. Ответы сохраняются на сервере.</p></div>';document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=async()=>{if(busy)return;busy=true;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);try{const a=Number(btn.dataset.answer);await api('answer',{index,answer:a});state.answers[index]=a;renderQuiz()}catch(e){error(e)}finally{busy=false}});$('#prev').onclick=()=>{index--;renderQuiz()};$('#next').onclick=async()=>{if(busy)return;if(index<4){index++;renderQuiz();return}busy=true;try{const v=await api('finish');active=false;done(v.score)}catch(e){error(e)}finally{busy=false}}}
function done(score){active=false;app.innerHTML='<section id="quiz"><div class="eyebrow">ТЕСТ ЗАВЕРШЁН</div><h1>Готово.</h1><p>Твои ответы приняты. Результат сохранён у администратора.</p><div class="result">'+score+' <span class="muted">/ 5</span></div><p>Правильных ответов: '+score+' из 5.</p><p class="muted">Этот код больше не даёт новых попыток.</p></section>'}
async function refresh(){try{state=await api('state');if(state.status==='active'){const pending=localStorage.getItem('cg-ban-pending');if(pending){active=true;return ban(pending)}active=true;renderQuiz()}else if(state.status==='done')done(state.score);else ready()}catch(e){if(!$('.ban'))login()}}
async function admin(){active=false;app.innerHTML='<section><div class="eyebrow">CONTROL ROOM</div><h1>Панель администратора</h1><p>Ключ находится в терминале сервера или в переменной ADMIN_KEY.</p><form id="adminlogin"><label>Ключ администратора</label><input type="password" id="key" required autocomplete="off"><button class="wide">Открыть панель</button></form><p id="error" class="error"></p></section>';$('#adminlogin').onsubmit=async e=>{e.preventDefault();adminKey=$('#key').value;try{await list()}catch(e){error(e)}}}
async function list(){const {rows}=await api('admin/list',{},true);app.innerHTML='<div class="row"><div><div class="eyebrow">CONTROL ROOM</div><h1>Участники и доступ</h1></div><button id="reload" class="secondary">Обновить</button></div><section><form id="generate"><label>Имя или метка участника</label><div class="row"><input id="label" placeholder="Например: Алексей" maxlength="80"><button style="white-space:nowrap">Создать код +</button></div></form><p id="newcode" aria-live="polite" class="notice muted">Новый код показывается только один раз. Передай его участнику лично.</p><p id="error" class="error"></p></section><br><section class="tablewrap"><table><thead><tr><th>Участник</th><th>Статус</th><th>Результат</th><th>Причина</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.label)+'</td><td>'+esc(({new:'Не использован',ready:'Готов к старту',active:'Проходит тест',done:'Завершён',banned:'BANNED'})[r.status])+'</td><td>'+(r.score??'—')+'</td><td>'+esc(r.reason||'—')+'</td><td><button class="secondary" data-revoke="'+r.id+'" '+(r.status==='banned'?'disabled':'')+'>Отозвать</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<p>Пока нет участников. Создай первый код.</p>')+'</section>';$('#reload').onclick=()=>list().catch(error);$('#generate').onsubmit=async e=>{e.preventDefault();try{const v=await api('admin/create',{label:$('#label').value},true);await list();$('#newcode').innerHTML='Скопируй и сохрани код:<br><code>'+esc(v.code)+'</code>'}catch(e){error(e)}};document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{try{await api('admin/revoke',{id:Number(b.dataset.revoke)},true);await list()}catch(e){error(e)}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)ban('Переключение вкладки или сворачивание окна')});window.addEventListener('blur',()=>ban('Окно теста потеряло фокус'));window.addEventListener('pagehide',()=>{if(active){const reason='Выход из страницы во время теста';localStorage.setItem('cg-ban-pending',reason);navigator.sendBeacon('/api/ban',new Blob([JSON.stringify({browser,reason})],{type:'application/json'}))}});document.addEventListener('keydown',e=>{if(active&&(e.key==='PrintScreen'||((e.metaKey||e.ctrlKey)&&e.shiftKey&&['s','3','4','5'].includes(e.key.toLowerCase())))){e.preventDefault();ban('Обнаружена клавиша снимка экрана')}});
setInterval(async()=>{if(!active)return;try{const v=await api('state');offline=false;if(v.status==='done')done(v.score)}catch(e){if(!$('.ban')){offline=true;ban('Потеря соединения во время теста')}}},4000);
if(location.pathname==='/admin')admin();else refresh();
</script></html>
