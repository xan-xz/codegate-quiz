<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeGate · Пространство тестов</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#e9eef6;background:#0b1019;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#15334466,transparent 55%)}header{height:88px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.logo{font-size:23px;font-weight:800;letter-spacing:-1px}.logo span{color:#9bee8d}header small{color:#93a1b4;font-size:12px;letter-spacing:2px}main{max-width:1140px;margin:60px auto;padding:0 24px}.eyebrow{font:12px monospace;letter-spacing:2px;color:#9bee8d}h1{font-size:clamp(34px,6vw,60px);line-height:1.07;letter-spacing:-2px;margin:23px 0}h2{font-size:25px;line-height:1.3;letter-spacing:-.7px}p{color:#9daabd;line-height:1.75}section{background:#121b29;border:1px solid #ffffff14;border-radius:20px;padding:30px}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center}.chips{display:flex;gap:12px;margin:30px 0}.chip{border:1px solid #ffffff1c;padding:10px 14px;border-radius:8px;color:#c0ccdb;font-size:13px}label{display:block;color:#bdc8d8;font-size:13px;margin:20px 0 10px}input,select{width:100%;padding:15px;background:#0b121e;border:1px solid #344153;border-radius:10px;color:white;font:16px Arial,sans-serif}input:focus,select:focus,button:focus-visible{outline:2px solid #9bee8d;outline-offset:3px}button{cursor:pointer;border:0;border-radius:10px;padding:15px 20px;background:#a3ed94;color:#102617;font-weight:750;font-size:14px}button:disabled{opacity:.45;cursor:default}.wide{width:100%;margin-top:18px}.muted{color:#8695a9;font-size:13px}.error{color:#ff9999;min-height:20px}a{color:#9bee8d;text-decoration:none}footer{padding:32px 6vw;border-top:1px solid #ffffff12;display:flex;justify-content:space-between;color:#68798e;font-size:12px}.line{height:5px;background:#263348;border-radius:8px;margin:24px 0}.line i{display:block;height:100%;background:#9bee8d;border-radius:8px}.option{display:flex;align-items:center;width:100%;text-align:left;background:#0d1522;border:1px solid #2a384b;color:#ced8e5;margin:12px 0;gap:18px}.option.selected{border-color:#9bee8d;background:#9bee8d15}.option b{font:13px monospace;color:#8393a9}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.secondary{background:#243247;color:#d7e1ee}.danger{background:#ef526518;color:#ff9aa6}#quiz{max-width:740px;margin:auto}.status{color:#9bee8d;font:12px monospace}.ban{position:fixed;inset:0;background:#c51127;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:100}.ban h1{font-size:clamp(64px,16vw,160px);letter-spacing:-6px;margin:12px 0}.ban p,.ban small{color:#ffe1e6}.badge{font:12px monospace;letter-spacing:2px}.result{font-size:80px;color:#9bee8d;margin:24px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:15px 10px;border-bottom:1px solid #ffffff14;vertical-align:top}th{color:#95a6bc;font-weight:500;white-space:nowrap}td button{padding:9px;font-size:12px;white-space:nowrap}.tablewrap{overflow-x:auto}td .muted{margin-top:5px;display:block;font-size:11px}.notice{border-left:2px solid #9bee8d;padding-left:16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.stat{padding:20px;background:#121b29;border:1px solid #ffffff12;border-radius:14px}.stat b{font-size:30px;display:block;margin-bottom:8px}.stat span{color:#8d9eb4;font-size:12px}.filters{display:grid;grid-template-columns:1fr 190px auto;gap:12px;margin:20px 0}.pill{display:inline-block;padding:6px 9px;border-radius:6px;background:#273447;color:#ced8e5;font-size:11px;white-space:nowrap}.pill.active,.good{color:#a3ed94}.pill.banned,.bad{color:#ff9aa6}.pill.banned{background:#ef526518}.progress{height:4px;width:90px;background:#2b384a;margin:9px 0;border-radius:3px}.progress i{display:block;background:#9bee8d;height:100%;border-radius:3px}.details{margin-top:26px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:22px 0}.facts label{margin:0 0 7px}.facts span{font-size:14px}.answer-card{padding:20px 0;border-bottom:1px solid #ffffff14}.answer-card p{margin:8px 0;font-size:14px}.events{list-style:none;padding:0;margin:20px 0}.events li{display:grid;grid-template-columns:155px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid #ffffff10;font-size:13px}.events time{color:#8b9bb1}.hidden{display:none}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.name{color:#d1dfd2;font-size:13px;margin-top:10px}.loading{padding:40px;text-align:center;color:#8695a9}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.empty{padding:32px;text-align:center;color:#8d9eb4}@media(max-width:750px){.grid{grid-template-columns:1fr;gap:25px}main{margin:36px auto}section{padding:22px}header{padding:0 24px;height:72px}header small{font-size:9px}.chips{flex-wrap:wrap}footer{gap:20px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}.events li{grid-template-columns:1fr;gap:6px}.row.wrap{align-items:flex-start;flex-direction:column}td,th{padding:12px 8px}h1{letter-spacing:-1px}}
.warning-scrim{position:fixed;inset:0;z-index:90;background:#060b14dc;display:grid;place-items:center;padding:24px}.warning-scrim section{max-width:540px;border:1px solid #edbd62}.warning-scrim h2{color:#ffd48b}.editor-card{margin:20px 0}.editor-card textarea{width:100%;resize:vertical;min-height:100px;padding:14px;border:1px solid #344153;border-radius:10px;background:#0b121e;color:#e9eef6;font:16px Arial,sans-serif}.editor-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor-options label{margin-top:12px}#editorStatus{color:#a3ed94;min-height:22px}@media(max-width:650px){.editor-options{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo"><span>&lt;/&gt;</span> CodeGate</div><small>ASSESSMENT SPACE</small></header>
<main id="app"><div class="loading">Загрузка…</div></main>
<footer><span>Тесты на любую тему</span><a href="/admin">Администратор ↗</a></footer>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let state=null,index=0,active=false,busy=false,adminKey='',adminMode=false,selectedId=null,cursor=null,nextCursor=null,cursorHistory=[],listVersion=0,polling=false;
let browser=localStorage.getItem('cg-browser');if(!browser){browser=crypto.randomUUID();localStorage.setItem('cg-browser',browser)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let warningVisible=false,violationBusy=false,lastIncidentAt=0,editorMode=false,questionDraft=[],draftRevision=0,draftDirty=false;
const statuses={new:'Старое приглашение',ready:'Готов к старту',active:'Проходит тест',done:'Завершён',banned:'BANNED'};
const date=n=>n?new Date(n).toLocaleString('ru-RU'):'—';
const duration=n=>n===null||n===undefined?'—':Math.floor(n/60000)+' мин '+Math.floor(n%60000/1000)+' с';
async function api(path,data={},admin=false){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(admin?{'X-Admin-Key':adminKey}:{})},body:JSON.stringify({...data,browser})});const v=await r.json();if(v.banned&&!admin){banned(v.error);throw Error(v.error)}if(!r.ok){const e=Error(v.error);e.status=r.status;throw e}return v}
function error(e){const el=$('#error');if(el)el.textContent=e.message||e}
function banned(reason){active=false;warningVisible=false;$('#warningLayer')?.remove();localStorage.removeItem('cg-incident-pending');localStorage.removeItem('cg-ban-pending');app.innerHTML='<div class="ban"><div><div class="badge">ПОПЫТКА ЗАБЛОКИРОВАНА</div><h1>BANNED</h1><p>'+esc(reason)+'</p><small>Событие сохранено в отчёте. Обратитесь к администратору.</small><br><button id="checkAccess" style="margin-top:24px">Проверить доступ</button></div></div>';$('#checkAccess').onclick=refresh}
function getPending(){try{return JSON.parse(localStorage.getItem('cg-incident-pending')||'null')}catch{return null}}
function newIncident(reason){const incident={reason,eventId:crypto.randomUUID()};localStorage.setItem('cg-incident-pending',JSON.stringify(incident));return incident}
function warning(reason,pending=false){warningVisible=true;$('#warningLayer')?.remove();const layer=document.createElement('div');layer.id='warningLayer';layer.className='warning-scrim';layer.setAttribute('role','alertdialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-labelledby','warningTitle');layer.innerHTML='<section><div class="eyebrow">КОНТРОЛЬ ПРОХОЖДЕНИЯ</div><h2 id="warningTitle">'+(pending?'Сохраняем событие…':'Предупреждение '+state.warnings+'/'+state.warningLimit)+'</h2><p>'+esc(reason)+'</p><p class="muted">'+(pending?'Нужно соединение с сервером. Событие будет отправлено повторно.':state.warnings>=state.warningLimit?'Все 3 предупреждения использованы. Следующее нарушение заблокирует попытку.':'Вернись к тесту. После трёх предупреждений следующее нарушение вызовет BANNED.')+'</p><p id="warningError" class="error"></p><button id="warningContinue" class="wide">'+(pending?'Повторить отправку':'Понятно, продолжить тест')+'</button></section>';document.body.append(layer);$('#warningContinue').onclick=()=>{if(pending){const incident=getPending();if(incident)submitViolation(incident);return}if(document.hidden||!document.hasFocus())return;layer.remove();warningVisible=false;lastIncidentAt=Date.now();};$('#warningContinue').focus()}
async function submitViolation(incident){if(violationBusy||!active)return;violationBusy=true;warning(incident.reason,true);try{const v=await api('violation',incident);localStorage.removeItem('cg-incident-pending');localStorage.removeItem('cg-ban-pending');if(!active)return;state.warnings=Math.max(state.warnings||0,v.warnings);state.warningLimit=v.warningLimit;const counter=$('#warningCount');if(counter)counter.textContent='Предупреждения: '+state.warnings+' / '+state.warningLimit;warning(incident.reason)}catch(e){if(active&&$('#warningError'))$('#warningError').textContent=e.message}finally{violationBusy=false}}
function recordViolation(reason){if(!active||warningVisible||violationBusy||Date.now()-lastIncidentAt<2000)return;lastIncidentAt=Date.now();submitViolation(getPending()||newIncident(reason))}

function login(){app.innerHTML='<div class="grid"><div><div class="eyebrow">ТВОЯ ПРОВЕРКА ЗНАНИЙ / 01</div><h1>Твои знания.<br>Твой результат.</h1><p>Пройди тест и проверь свои знания.<br>Введи имя и фамилию — и можно начинать.</p><div class="chips"><span class="chip">3 предупреждения</span><span class="chip">1 попытка</span><span class="chip">Честная игра</span></div></div><section><div class="eyebrow">ВХОД УЧАСТНИКА</div><h2>Давай познакомимся</h2><form id="login"><label for="firstName">Имя</label><input id="firstName" name="given-name" placeholder="Например: Азат" required autocomplete="given-name" maxlength="60"><label for="lastName">Фамилия</label><input id="lastName" name="family-name" placeholder="Например: Араппаев" required autocomplete="family-name" maxlength="60"><button class="wide">Продолжить →</button></form><p class="error" id="error" role="alert"></p><div class="muted">Имя, ответы, время, события контроля, IP подключения и сведения об устройстве и браузере будут видны администратору.</div></section></div>';$('#login').onsubmit=async e=>{e.preventDefault();const btn=$('#login button');btn.disabled=true;try{await api('register',{firstName:$('#firstName').value,lastName:$('#lastName').value});localStorage.removeItem('cg-ban-pending');localStorage.removeItem('cg-incident-pending');await refresh()}catch(e){error(e);btn.disabled=false}}}
function ready(){active=false;app.innerHTML='<section id="quiz"><div class="eyebrow">ПЕРЕД СТАРТОМ</div><div class="name">'+esc(state.name)+'</div><h1>Одна попытка.<br>Полная концентрация.</h1><p>В тесте '+state.questionCount+' вопросов. За переключение вкладки, уход из окна или сворачивание ты получишь предупреждение. Первые три нарушения — предупреждения, четвёртое — BANNED.</p><p class="notice">Некоторые клавиши снимка экрана отслеживаются. Браузер не может обнаружить все скриншоты, особенно на телефоне. Даже случайная потеря фокуса может вызвать предупреждение.</p><p class="muted">Закрой уведомления и подготовься до старта. Администратор видит ответы, текущий вопрос, время и журнал событий.</p><label><input type="checkbox" id="agree" style="width:auto;margin-right:10px">Я понимаю правила и готов начать</label><button class="wide" id="start" disabled>Начать тест →</button><p id="error" class="error" role="alert"></p></section>';$('#agree').onchange=e=>$('#start').disabled=!e.target.checked;$('#start').onclick=async()=>{const btn=$('#start');btn.disabled=true;try{await api('start');await refresh()}catch(e){error(e);btn.disabled=false}}}
async function progress(){if(!active)return;try{await api('progress',{index})}catch(e){if(e.status===423)return;if(e.status===409){await refresh();return}recordViolation('Потеря соединения во время теста')}}
function renderQuiz(){const q=state.questions[index],count=state.questions.length;app.innerHTML='<div id="quiz"><div class="row"><span class="eyebrow">ВОПРОС '+(index+1)+' / '+count+'</span><span class="status">● КОНТРОЛЬ АКТИВЕН</span></div><div class="name">'+esc(state.name)+'</div><p class="muted" id="warningCount">Предупреждения: '+(state.warnings||0)+' / '+state.warningLimit+'</p><div class="line"><i style="width:'+((index+1)/count*100)+'%"></i></div><section><h2>'+esc(q.q)+'</h2>'+q.o.map((o,i)=>'<button class="option '+(state.answers[index]===i?'selected':'')+'" data-answer="'+i+'"><b>'+String.fromCharCode(65+i)+'</b>'+esc(o)+'</button>').join('')+'<p class="error" id="error" role="alert"></p><div class="row"><button id="prev" class="secondary" '+(index===0?'disabled':'')+'>← Назад</button><button id="next" '+(state.answers[index]===undefined?'disabled':'')+'>'+(index===count-1?'Завершить тест':'Следующий →')+'</button></div></section><p class="muted">Оставайся в этом окне до завершения. Ответы сохраняются на сервере.</p></div>';document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=async()=>{if(busy||warningVisible||violationBusy)return;busy=true;document.querySelectorAll('[data-answer],#next,#prev').forEach(x=>x.disabled=true);try{const a=Number(btn.dataset.answer);await api('answer',{index,answer:a});state.answers[index]=a;renderQuiz()}catch(e){error(e)}finally{busy=false}});$('#prev').onclick=()=>{if(busy||warningVisible||violationBusy)return;index--;renderQuiz();progress()};$('#next').onclick=async()=>{if(busy||warningVisible||violationBusy)return;if(index<count-1){index++;renderQuiz();progress();return}busy=true;$('#next').disabled=true;try{const v=await api('finish');active=false;done(v.score)}catch(e){error(e);if($('#next'))$('#next').disabled=false}finally{busy=false}}}
function done(score){active=false;warningVisible=false;$('#warningLayer')?.remove();app.innerHTML='<section id="quiz"><div class="eyebrow">ТЕСТ ЗАВЕРШЁН</div><h1>Готово, '+esc(state.name)+'.</h1><p>Ответы приняты. Администратор видит подробный отчёт о твоём прохождении.</p><div class="result">'+score+' <span class="muted">/ '+state.questionCount+'</span></div><p>Правильных ответов: '+score+' из '+state.questionCount+'.</p><button id="checkRetry" class="secondary">Проверить повторную попытку</button></section>';$('#checkRetry').onclick=refresh}
async function refresh(){try{state=await api('state');if(state.status==='active'){index=Math.max(0,Math.min(state.questions.length-1,state.currentQuestion||0));const pending=getPending()||(localStorage.getItem('cg-ban-pending')?newIncident(localStorage.getItem('cg-ban-pending')):null);active=true;renderQuiz();if(pending)submitViolation(pending);else progress()}else if(state.status==='done')done(state.score);else ready()}catch(e){if(e.status===401||e.status===403)login();else if(!$('.ban')){app.innerHTML='<section><h2>Не удалось загрузить тест</h2><p id="error" class="error"></p><button id="retry">Попробовать ещё</button></section>';error(e);$('#retry').onclick=refresh}}}
function admin(){active=false;app.innerHTML='<section id="quiz"><div class="eyebrow">CONTROL ROOM</div><h1>Панель администратора</h1><p>Введи ключ администратора, чтобы открыть результаты и наблюдать за прохождением.</p><form id="adminlogin"><label for="key">Ключ администратора</label><input type="password" id="key" required autocomplete="off"><button class="wide">Открыть отчёты →</button></form><p id="error" class="error" role="alert"></p></section>';$('#adminlogin').onsubmit=async e=>{e.preventDefault();adminKey=$('#key').value.trim();try{await api('admin/list',{},true);adminMode=true;dashboard();await loadList()}catch(e){error(e)}}}
function dashboard(){app.innerHTML='<div class="row wrap"><div><div class="eyebrow">CONTROL ROOM / LIVE</div><h1>Как проходит тест</h1><p class="muted">Автообновление каждые 5 секунд · <span id="updated">обновление…</span></p></div><div class="top-actions"><button id="editQuestions" class="secondary">Вопросы ✎</button><button id="export" class="secondary">Скачать CSV ↓</button><button id="logout" class="secondary">Выйти</button></div></div><div id="stats" class="stats"></div><div class="filters"><input id="search" aria-label="Поиск участника" placeholder="Поиск по имени или фамилии"><select id="filter" aria-label="Статус"><option value="">Все статусы</option><option value="ready">Готовы к старту</option><option value="active">Проходят тест</option><option value="done">Завершили</option><option value="banned">BANNED</option></select><button id="reload" class="secondary">Обновить</button></div><p id="error" class="error" role="alert"></p><section class="tablewrap"><table><thead><tr><th>Участник</th><th>Статус</th><th>Прогресс</th><th>Время</th><th>Результат</th><th></th></tr></thead><tbody id="participants"></tbody></table><div id="empty" class="empty hidden">Участники не найдены.</div></section><div class="row" style="margin-top:18px"><button id="previous" class="secondary" disabled>← Назад</button><button id="more" class="secondary" disabled>Следующие →</button></div><div id="report"></div>';
 $('#logout').onclick=()=>{adminMode=false;adminKey='';selectedId=null;cursor=null;cursorHistory=[];admin()};$('#reload').onclick=()=>loadList().catch(error);let debounce;$('#search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>{cursor=null;cursorHistory=[];loadList().catch(error)},300)};$('#filter').onchange=()=>{cursor=null;cursorHistory=[];loadList().catch(error)};$('#more').onclick=()=>{cursorHistory.push(cursor);cursor=nextCursor;loadList().catch(error)};$('#previous').onclick=()=>{cursor=cursorHistory.pop()??null;loadList().catch(error)};$('#export').onclick=exportCSV;$('#editQuestions').onclick=openEditor;
}
function connection(r){if(r.status!=='active')return '';return r.last_seen_at&&Date.now()-r.last_seen_at<20000?'На связи':'Нет связи более 20 с'}
async function loadList(){if(!adminMode||editorMode)return;const version=++listVersion;const data=await api('admin/list',{search:$('#search').value.trim(),status:$('#filter').value,before:cursor},true);if(version!==listVersion||!adminMode||editorMode)return;const {rows,stats}=data;nextCursor=data.next;$('#stats').innerHTML=[['Участников',stats.total],['Проходят',stats.active],['Готовы',stats.ready],['Завершили',stats.done],['BANNED',stats.banned]].map(([label,value])=>'<div class="stat"><b>'+Number(value||0)+'</b><span>'+label+'</span></div>').join('');$('#participants').innerHTML=rows.map(r=>'<tr><td><strong>'+esc(r.label)+'</strong><span class="muted">Попытка #'+r.id+' · '+esc(date(r.joined_at))+'</span><span class="muted">'+esc(r.device)+'</span><span class="muted">IP: '+esc(r.last_ip_address||r.ip_address||'нет данных')+'</span></td><td><span class="pill '+esc(r.status)+'">'+esc(statuses[r.status]||r.status)+'</span><span class="muted">'+connection(r)+'</span><span class="muted">Предупреждения: '+r.warnings+' / 3</span></td><td>'+r.answered+' / '+r.question_count+' ответов<div class="progress"><i style="width:'+(r.answered/r.question_count*100)+'%"></i></div><span class="muted">'+(r.status==='active'?'Сейчас: вопрос '+(r.current_question+1):'')+'</span></td><td>'+duration(r.duration_ms)+'</td><td>'+(r.score===null?'—':r.score+' / '+r.question_count)+'</td><td><button data-report="'+r.id+'" class="secondary">Отчёт ↗</button></td></tr>').join('');$('#empty').classList.toggle('hidden',rows.length>0);$('#updated').textContent=new Date().toLocaleTimeString('ru-RU');$('#more').disabled=!nextCursor;$('#previous').disabled=!cursorHistory.length;document.querySelectorAll('[data-report]').forEach(btn=>btn.onclick=async()=>{selectedId=Number(btn.dataset.report);await loadReport().catch(error);$('#report')?.scrollIntoView({behavior:'smooth',block:'start'})});if(selectedId)await loadReport()}
function eventText(e){const d=e.detail;if(e.kind==='admin_unban')return 'Администратор снял бан и сбросил предупреждения';if(e.kind==='retry_granted')return 'Выдана новая попытка #'+d.nextId;if(e.kind==='retry_created')return 'Повторная попытка после #'+d.previousId;if(e.kind==='warning')return 'Предупреждение '+d.number+' / 3: '+d.reason;if(e.kind==='registered')return 'Ввёл имя и фамилию';if(e.kind==='started')return 'Начал тест';if(e.kind==='question')return 'Перешёл к вопросу '+(d.index+1);if(e.kind==='answer')return 'Вопрос '+(d.index+1)+': выбран вариант '+String.fromCharCode(65+d.answer);if(e.kind==='finished')return 'Завершил тест';if(e.kind==='banned'||e.kind==='admin_ban')return 'Блокировка: '+d.reason;return e.kind}
async function loadReport(){const id=selectedId;if(!id||!adminMode)return;const v=await api('admin/report',{id},true);if(id!==selectedId||!adminMode||editorMode)return;const r=v.participant;$('#report').innerHTML='<section class="details"><div class="row wrap"><div><div class="eyebrow">ПОДРОБНЫЙ ОТЧЁТ / #'+r.id+'</div><h2>'+esc(r.label)+'</h2></div><div class="toolbar">'+(r.status==='banned'&&!r.next_attempt_id?'<button id="unban" class="secondary">Снять бан</button>':'')+(['banned','done'].includes(r.status)&&!r.next_attempt_id&&r.first_name?'<button id="retryAttempt">Дать новую попытку</button>':'')+(['ready','active'].includes(r.status)?'<button id="revoke" class="danger">Остановить попытку</button>':'')+'<button id="closeReport" class="secondary">Закрыть</button></div></div><span class="pill '+esc(r.status)+'">'+esc(statuses[r.status]||r.status)+'</span><div class="facts">'+[['Регистрация',date(r.joined_at)],['Начало',date(r.started_at)],['Окончание',date(r.finished_at)],['Время прохождения',duration(r.duration_ms)],['Последняя связь',date(r.last_seen_at)],['Результат',r.score===null?'Пока нет':r.score+' / '+r.question_count],['Предупреждений',r.warnings+' / 3'],['Первый зафиксированный IP',r.ip_address||'Нет данных'],['Последний IP',r.last_ip_address||'Нет данных'],['Устройство при первом подключении',r.device],['Последнее устройство',r.last_device]].map(([k,val])=>'<div><label>'+k+'</label><span>'+esc(val)+'</span></div>').join('')+'</div>'+(r.reason?'<p class="bad">'+esc(r.reason)+'</p>':'')+'<p class="muted">Сведения об устройстве определяются по данным браузера; точная модель может быть недоступна. IP может принадлежать общей сети или VPN.</p>'+(r.previous_attempt_id?'<button class="secondary" data-related="'+r.previous_attempt_id+'">← Предыдущая попытка #'+r.previous_attempt_id+'</button>':'')+(r.next_attempt_id?'<button class="secondary" data-related="'+r.next_attempt_id+'">Следующая попытка #'+r.next_attempt_id+' →</button>':'')+'<p class="muted">Браузер: '+esc(r.user_agent||'Нет данных — старая попытка')+'</p><h2>Ответы по вопросам</h2>'+v.questions.map(q=>'<div class="answer-card"><strong>'+(q.index+1)+'. '+esc(q.q)+'</strong><p class="'+(q.correct===null?'muted':q.correct?'good':'bad')+'">Ответ: '+(q.selected===null?'ещё не выбран':esc(q.o[q.selected]))+' '+(q.correct===null?'':q.correct?'✓ Верно':'✕ Неверно')+'</p><div class="muted">Правильный ответ: '+esc(q.o[q.a])+'</div></div>').join('')+'<h2>Журнал прохождения</h2><p class="muted">Новые события сверху. Время показано в часовом поясе этого устройства.</p><ul class="events">'+v.events.map(e=>'<li><time>'+esc(date(e.created_at))+'</time><span>'+esc(eventText(e))+'</span></li>').join('')+'</ul>'+(v.events.length?'':'<p class="muted">История для старой попытки отсутствует.</p>')+(v.events_truncated?'<p class="muted">Показаны последние 500 событий.</p>':'')+'</section>';$('#closeReport').onclick=()=>{selectedId=null;$('#report').innerHTML=''};document.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{selectedId=Number(b.dataset.related);loadReport().catch(error)});if($('#unban'))$('#unban').onclick=()=>adminAttemptAction('unban',id);if($('#retryAttempt'))$('#retryAttempt').onclick=()=>adminAttemptAction('retry',id);if($('#revoke'))$('#revoke').onclick=async()=>{try{await api('admin/revoke',{id},true);await loadList()}catch(e){error(e)}}}
async function adminAttemptAction(action,id){const controls=document.querySelectorAll('#unban,#retryAttempt,#revoke');controls.forEach(b=>b.disabled=true);try{const result=await api('admin/'+action,{id},true);if(action==='retry')selectedId=result.id;await loadList();const message=document.createElement('p');message.className='notice good';message.textContent=action==='retry'?'Новая попытка выдана. Участник может обновить страницу или нажать «Проверить повторную попытку / доступ». Предыдущий отчёт сохранён.':'Бан снят, предупреждения сброшены. Ответы сохранены. Участник может обновить страницу или нажать «Проверить доступ».';$('#report').prepend(message)}catch(e){error(e);controls.forEach(b=>b.disabled=false)}}
async function exportCSV(){const btn=$('#export');btn.disabled=true;try{const r=await fetch('/api/admin/export',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':adminKey},body:'{}'});if(!r.ok)throw Error((await r.json()).error);const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='codegate-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){error(e)}finally{btn.disabled=false}}
async function openEditor(){try{const config=await api('admin/questions',{},true);editorMode=true;questionDraft=config.questions;draftRevision=config.revision;draftDirty=false;renderEditor()}catch(e){error(e)}}
function setDraftDirty(){draftDirty=true;$('#editorStatus').textContent='Есть несохранённые изменения.'}
function renderEditor(){app.innerHTML='<div class="row wrap"><div><div class="eyebrow">НАСТРОЙКИ ТЕСТА</div><h1>Вопросы и ответы</h1><p>Вопросов: <strong>'+questionDraft.length+'</strong> / 100. У каждого вопроса — 4 варианта и один правильный ответ.</p></div><div class="top-actions"><button id="backReports" class="secondary">← К отчётам</button><button id="saveQuestions">Сохранить вопросы</button></div></div><p class="notice muted">Изменения применятся к новым запускам теста. Уже начатые попытки и их отчёты сохраняют прежние вопросы.</p><p id="editorStatus" role="status">'+(draftDirty?'Есть несохранённые изменения.':'')+'</p><p id="error" class="error" role="alert"></p><div id="questionEditor">'+questionDraft.map((q,i)=>'<section class="editor-card"><div class="row"><h2>Вопрос '+(i+1)+'</h2><div class="toolbar"><button class="secondary" data-up="'+i+'" '+(i===0?'disabled':'')+' aria-label="Поднять вопрос">↑</button><button class="secondary" data-down="'+i+'" '+(i===questionDraft.length-1?'disabled':'')+' aria-label="Опустить вопрос">↓</button><button class="danger" data-remove="'+i+'" '+(questionDraft.length===1?'disabled':'')+'>Удалить</button></div></div><label for="question-'+i+'">Текст вопроса</label><textarea id="question-'+i+'" data-question="'+i+'" maxlength="1000">'+esc(q.q)+'</textarea><div class="editor-options">'+q.o.map((o,j)=>'<div><label for="option-'+i+'-'+j+'">Вариант '+String.fromCharCode(65+j)+'</label><input id="option-'+i+'-'+j+'" data-option="'+i+'" data-choice="'+j+'" maxlength="500" value="'+esc(o)+'"></div>').join('')+'</div><label for="correct-'+i+'">Правильный ответ</label><select id="correct-'+i+'" data-correct="'+i+'">'+q.o.map((_,j)=>'<option value="'+j+'" '+(q.a===j?'selected':'')+'>Вариант '+String.fromCharCode(65+j)+'</option>').join('')+'</select></section>').join('')+'</div><button id="addQuestion" class="secondary wide" '+(questionDraft.length>=100?'disabled':'')+'>+ Добавить вопрос</button>';
 $('#questionEditor').oninput=e=>{const t=e.target;if(t.dataset.question!==undefined)questionDraft[Number(t.dataset.question)].q=t.value;else if(t.dataset.option!==undefined)questionDraft[Number(t.dataset.option)].o[Number(t.dataset.choice)]=t.value;else if(t.dataset.correct!==undefined)questionDraft[Number(t.dataset.correct)].a=Number(t.value);else return;setDraftDirty()};
 document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{questionDraft.splice(Number(b.dataset.remove),1);draftDirty=true;renderEditor()});
 document.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const from=Number(b.dataset.up??b.dataset.down),to=from+(b.dataset.up!==undefined?-1:1);[questionDraft[from],questionDraft[to]]=[questionDraft[to],questionDraft[from]];draftDirty=true;renderEditor()});
 $('#addQuestion').onclick=()=>{questionDraft.push({q:'',o:['','','',''],a:0});draftDirty=true;renderEditor();$('.editor-card:last-child')?.scrollIntoView({behavior:'smooth',block:'start'})};
 $('#backReports').onclick=()=>{editorMode=false;draftDirty=false;dashboard();loadList().catch(error)};
 $('#saveQuestions').onclick=async()=>{const btn=$('#saveQuestions');btn.disabled=true;try{const saved=await api('admin/questions/save',{questions:questionDraft,revision:draftRevision},true);draftRevision=saved.revision;draftDirty=false;$('#editorStatus').textContent='Сохранено. Вопросов: '+saved.count+'. Новые тесты используют эту версию.';$('#error').textContent=''}catch(e){error(e)}finally{btn.disabled=false}};
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)recordViolation('Переключение вкладки или сворачивание окна')});
window.addEventListener('blur',()=>recordViolation('Окно теста потеряло фокус'));
window.addEventListener('pagehide',()=>{if(!active)return;const incident=getPending()||(!warningVisible?newIncident('Выход из страницы во время теста'):null);if(incident)navigator.sendBeacon('/api/violation',new Blob([JSON.stringify({browser,...incident})],{type:'application/json'}))});
document.addEventListener('keydown',e=>{if(active&&(e.key==='PrintScreen'||((e.metaKey||e.ctrlKey)&&e.shiftKey&&['s','3','4','5'].includes(e.key.toLowerCase())))){e.preventDefault();recordViolation('Обнаружена клавиша снимка экрана')}});
setInterval(async()=>{if(polling)return;polling=true;try{if(adminMode&&!editorMode)await loadList();else if(active){if(getPending())await submitViolation(getPending());else await progress();if(active){const s=await api('state');state.warnings=s.warnings;state.warningLimit=s.warningLimit;if(s.status==='done')done(s.score)}}}catch(e){error(e)}finally{polling=false}},5000);
if(location.pathname==='/admin')admin();else refresh();
</script></body></html>
